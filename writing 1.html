<title>Аналогия тесттери</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap">
<style>
/* Layout: one narrow reading column. The analogy pair is set big like a ratio, answers are lettered rows, the reason sits directly under the chosen row. */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --fg: #14202A;
  --muted: #566673;
  --line: #D3DAE1;
  --accent: #0D6B68;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDF0EE;
  --mark: #D99A00;
  --ok: #17703A;
  --ok-bg: #E1F2E7;
  --bad: #B3261E;
  --bad-bg: #FAE6E4;
  --warn-bg: #FFF1CC;
  --warn-fg: #664700;
  --f-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --f-disp: 'Source Serif 4', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E161C; --surface: #17232C; --fg: #E6EDF2; --muted: #93A4B1; --line: #2B3A46;
    --accent: #4FC3BC; --accent-ink: #06201F; --accent-soft: #14312F; --mark: #E7B545;
    --ok: #6FD18C; --ok-bg: #14301F; --bad: #FF8A80; --bad-bg: #3A1815;
    --warn-bg: #3A2D0B; --warn-fg: #F1CE7A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E161C; --surface: #17232C; --fg: #E6EDF2; --muted: #93A4B1; --line: #2B3A46;
  --accent: #4FC3BC; --accent-ink: #06201F; --accent-soft: #14312F; --mark: #E7B545;
  --ok: #6FD18C; --ok-bg: #14301F; --bad: #FF8A80; --bad-bg: #3A1815;
  --warn-bg: #3A2D0B; --warn-fg: #F1CE7A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font: 400 16px/1.55 var(--f-ui);
}
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Home */
.hero { display: grid; gap: 10px; padding: 12px 0 22px; }
.kicker { font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.hero h1 { font: 700 clamp(1.9rem, 6vw, 2.6rem)/1.1 var(--f-disp); }
.hero p { color: var(--muted); max-width: 52ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.tile {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px; display: grid; gap: 12px; text-align: left; min-width: 0;
}
.tile .num { font: 700 2.1rem/1 var(--f-disp); color: var(--accent); }
.tile .meta { color: var(--muted); font-size: .9rem; }
.tile .best { font-weight: 600; font-variant-numeric: tabular-nums; }
.tile:hover { border-color: var(--accent); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px; border-radius: 10px; border: 1.5px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); font-weight: 600; min-height: 44px;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.legend { margin-top: 22px; padding: 14px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: .92rem; }
.legend b { color: var(--fg); }

/* Quiz */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 8px 0; min-height: 44px; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.dots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-bottom: 16px; }
.dot {
  min-width: 0; aspect-ratio: 1.15; border-radius: 8px; border: 1.5px solid var(--line);
  background: var(--surface); font-size: .8rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); padding: 0;
}
.dot.cur { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dot.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.dot.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 18px; display: grid; gap: 16px; }
.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lead { color: var(--muted); font-size: .92rem; }
.stem { padding: 14px 16px; border-radius: 10px; background: var(--accent-soft); }
.pair { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.pc { color: var(--mark); font-weight: 700; }
.stem .pair { font: 700 clamp(1.45rem, 5.2vw, 2rem)/1.25 var(--f-disp); overflow-wrap: anywhere; }
.stem .pc { font-size: 1.15em; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 10px; align-items: baseline;
  width: 100%; text-align: left; padding: 12px 14px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--surface); min-height: 48px;
}
.opt:hover { border-color: var(--accent); }
.opt .ltr {
  display: inline-grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%;
  border: 1.5px solid var(--line); font-weight: 600; font-size: .9rem; align-self: center;
}
.opt .pair { font: 500 1.08rem/1.35 var(--f-disp); overflow-wrap: anywhere; }
.opt.locked { cursor: default; }
.opt.locked:hover { border-color: var(--line); }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.ok .ltr { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt.bad .ltr { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.dim { opacity: .62; }
.opt .tag { grid-column: 2; font: 600 .8rem var(--f-ui); }
.opt.ok .tag { color: var(--ok); }
.opt.bad .tag { color: var(--bad); }

.fb { border-radius: 12px; padding: 16px; display: grid; gap: 10px; border: 1.5px solid var(--line); }
.fb.ok { border-color: var(--ok); background: var(--ok-bg); }
.fb.bad { border-color: var(--bad); background: var(--bad-bg); }
.verdict { font-weight: 700; font-size: 1.1rem; }
.fb.ok .verdict { color: var(--ok); }
.fb.bad .verdict { color: var(--bad); }
.why-h { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.rel { font-weight: 600; }
.why { max-width: 62ch; }
.note { padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-size: .92rem; }
.note.warn { background: var(--warn-bg); color: var(--warn-fg); border-color: transparent; }
.note b { font-weight: 600; }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* Result */
.score { display: grid; gap: 12px; padding: 20px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 16px; }
.score .big { font: 700 clamp(2.6rem, 11vw, 3.6rem)/1 var(--f-disp); font-variant-numeric: tabular-nums; color: var(--accent); }
.meter { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.tabs { display: flex; gap: 8px; margin: 18px 0 12px; flex-wrap: wrap; }
.tab { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; min-height: 40px; }
.tab[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.rev { display: grid; gap: 10px; }
details.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
details.item > summary {
  list-style: none; cursor: pointer; padding: 12px 14px; display: grid;
  grid-template-columns: 2.2rem minmax(0, 1fr) auto; gap: 10px; align-items: baseline;
}
details.item > summary::-webkit-details-marker { display: none; }
.qn { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
details.item .pair { font: 700 1.1rem/1.3 var(--f-disp); overflow-wrap: anywhere; }
.chip { font-size: .78rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.skip { background: var(--line); color: var(--muted); }
.item .body { padding: 2px 14px 14px; display: grid; gap: 10px; }
.ans { display: grid; gap: 4px; font-size: .95rem; }
.ans .pair { font: 500 1.02rem/1.35 var(--f-disp); }
.ans b { font-weight: 600; }

@media (max-width: 420px) {
  .card { padding: 16px 14px; }
  .dots { grid-template-columns: repeat(10, 1fr); gap: 4px; }
}
@media (prefers-reduced-motion: no-preference) {
  .opt, .btn, .tile, .dot { transition: border-color .15s, background-color .15s; }
}
</style>

<script>
const TESTS = [[{"n":39,"s":"Сулуу : серт","o":["Бийик : кыска","Чың : морт","Бекем : ийменчээк","Бакыт : капа"],"k":1,"r":"Антоним (карама-каршы маани)","e":"Суроодогу жуп карама-каршы мааниде берилген. «Чың» (бекем, сынбас) менен «морт» (оңой сынат) да карама-каршы сөздөр. Бийик : кыска жана бакыт : капа тең эмес, ал эми бекем : ийменчээк байланышсыз."},{"n":7,"s":"Тоюу : тамактануу","o":["Чарчоо : чуркоо","Айруу : кесүү","Жутуу : чайноо","Сынуу : тебүү"],"k":0,"r":"Натыйжа : анын себеби","e":"Тоюу тамактануунун натыйжасы (тамактансак тоюп калабыз). Чарчоо да чуркоонун натыйжасы. Калган варианттарда себеп менен натыйжа жок: айруу менен кесүү окшош иштер, жутуу менен чайноо тамак жеүүнүн баскычтары, сынуу менен тебүү байланышсыз."},{"n":78,"s":"Жүгүрүү : ден-соолук","o":["Тамак : ашказан","Шылдыңдоо : көңүл","Күлүү : маанай","Спорт : дене"],"k":2,"r":"Аракет : ал берген пайда","e":"Жүгүрүү ден-соолукка жакшы. Күлүү маанайды көтөрөт. Экөө тең «аракет : ал жакшырткан нерсе»."},{"n":70,"s":"Апта : шаршемби","o":["Ай : февраль","Минута : секунда","Жыл : июнь","Убакыт : мезгил"],"k":2,"r":"Бүтүн : анын бир бөлүгү","e":"Апта күндөрдөн турат, шаршемби анын бир күнү. Жыл айлардан турат, июнь анын бир айы. «Бүтүн : анын бир бөлүгү» ушул. Ай : февраль туура эмес, февраль айдын бөлүгү эмес, өзү бир ай."},{"n":3,"s":"Дальтонизм : көз","o":["Астма : өпкө","Псориаз : бут","Кардиолог : жүрөк","ЛОР : мурун"],"k":0,"r":"Оору : зыян тарткан орган","e":"Дальтонизм көздүн түстү айырмалоо оорусу. Астма да өпкөнүн оорусу. Псориаз тери оорусу, ал эми кардиолог менен ЛОР дарыгерлер, оору эмес, ошондуктан алар башка катарда турат.","w":"Булактагы тестте А вариантында «Астма : көз» деп жазылган, бул ката. Астма өпкө оорусу, ошондуктан бул жерде «өпкө» деп оңдолду."},{"n":43,"s":"Дарак : бутак","o":["Шаты : баскыч","Мейманкана : бөлмө","Шкаф : текче","Китеп : барак"],"k":1,"r":"Бүтүн : анын бөлүгү","e":"Дарак бутактардан турат. Мейманкана бөлмөлөрдөн турат. Экөө тең «бүтүн : анын бөлүгү».","i":"Калган үч вариант да «бүтүн : бөлүк» болуп турат. Ачкыч боюнча туура жооп Б."},{"n":93,"s":"Буйрук : капитан","o":["Буйрук : староста","Буйрук : ата","Буйрук : мугалим","Буйрук : сот"],"k":0,"r":"Буйрук берүүчү","e":"Капитан буйрук берет. Староста да тобун башкарып буйрук берет. Ачкыч боюнча туура жооп А.","i":"Ата, мугалим, сот да буйрук бере алат, ошондуктан бул суроо толук так эмес."},{"n":22,"s":"Көйнөк : үтүктөө","o":["Мебель : тазалоо","Үй : оңдоо","Кездеме : жуу","Бут кийим : майлоо"],"k":3,"r":"Буюм : ага жасалуучу кам көрүү","e":"Көйнөк үтүктөлөт, бут кийим майланат. Экөө тең кийим-кечеге жасалуучу кам көрүү иши. Калган варианттар башка тармакка таандык (үй-мүлк, курулуш)."},{"n":9,"s":"Биология : өсүмдүк","o":["Анатомия : жаныбар","Тарых : өтмүш","Адабият : тил","Астрономия : планета"],"k":3,"r":"Илим : анын изилдөө объектиси","e":"Биология өсүмдүктөрдү (жана жандуу дүйнөнү) үйрөнөт. Астрономия да космостук денелерди, алардын ичинде планеталарды үйрөнөт. «Илим : анын изилдөө объектиси» деген байланыш ушул. Адабият менен тил эки башка илим, ал эми анатомия жаныбар эмес, дененин түзүлүшүн үйрөнөт.","i":"«Тарых : өтмүш» да окшош көрүнөт, бирок ачкыч боюнча туура жооп Г."},{"n":64,"s":"Көз айнек : жакшыртуу","o":["Топ : ойноо","Щётка : щёткалоо","Саат : билүү","Дары : айыктыруу"],"k":3,"r":"Курал : анын максаты","e":"Көз айнек көрүүнү жакшыртат. Дары ооруну айыктырат. Экөө тең «курал : анын максаты». Щётка : щёткалоо сөз тукумун кайталайт, ал эми топ : ойноо жана саат : билүү максат эмес."},{"n":94,"s":"Жашоо : татаал","o":["Өмүр : ыракаттуу","Турмуш : максатсыз","Бакыт : ийгиликтүү","Эгемендүүлүк : баалуу"],"k":0,"r":"Түшүнүк : ага берилген баа","e":"Ачкыч боюнча туура жооп А (өмүр : ыракаттуу).","w":"Бул суроонун логикасы так эмес: «жашоо : татаал» деген жуптан «өмүр : ыракаттуу» болушу керектиги түшүнүксүз. Ачкычты түп нускадан текшерип алыңыз."},{"n":81,"s":"Мык : балка","o":["Сап : балта","Куту : калем","Дасторкон : устел","Суу : чайнек"],"k":3,"r":"Нерсе : аны иштеткен курал","e":"Мык балка менен кагылат. Суу чайнекте кайнатылат. «Нерсе : аны иштеткен курал/идиш».","w":"«Сап : балта» же «дасторкон : устел» да ылайык көрүнөт. Ачкыч Г дейт, текшерип алыңыз."},{"n":23,"s":"Кол чатыр : жамгыр","o":["Араа : устакана","Кайчы : чач тарач","Чырак : жер төлө","Көз айнек : күн"],"k":3,"r":"Коргоочу буюм : андан корголгон нерсе","e":"Кол чатыр жамгырдан коргойт. Көз айнек да күндөн коргойт. Калган варианттарда буюм кандайдыр бир жерде иштейт же иш аткарат, бирок коргоо милдети жок."},{"n":21,"s":"Метр : жип","o":["Акча : рубль","Сотых : аянт","Сантиметр : китеп","Километр : асман"],"k":1,"r":"Өлчөө бирдиги : өлчөнгөн нерсе","e":"Метр жиптин узундугун өлчөөчү бирдик. Сотых (сотка) жер аянтын өлчөөчү бирдик. Ачкыч боюнча туура жооп Б.","w":"«Сантиметр : китеп» да ошол эле логика менен түзүлгөн. Ачкычты түп нускадан текшерип алыңыз."},{"n":92,"s":"Стратосфера : атмосфера","o":["Сейсмология : кыртыш","Жогорку мантия : литосфера","Дүйнөлүк океан : гидросфера","Экосистема : биосфера"],"k":1,"r":"Бөлүк : бүтүн","e":"Стратосфера атмосферанын бир катмары. Жогорку мантия да литосферанын бир бөлүгү. «Бөлүк : бүтүн» ушул.","i":"В жана Г вариантында да бөлүк менен бүтүн бар. Ачкыч боюнча туура жооп Б."},{"n":18,"s":"Ысык : жай","o":["Суук : жаз","Түшүмдүү : күз","Ызгаардуу : кыш","Салкын : жаз"],"k":3,"r":"Сапат : ага мүнөздүү мезгил","e":"Ачкыч боюнча туура жооп Г (салкын : жаз). Жай ысык, жаз салкын деген ойлом.","w":"Бул суроодо «ызгаардуу : кыш» жана «түшүмдүү : күз» да логикага ылайык келет. Ачкыч Г дейт, бирок ката болушу мүмкүн, текшерип алыңыз."},{"n":48,"s":"Топчу : көйнөк","o":["Чорго : чайнек","Сыя : калем","Бантик : чач","Боо : бут кийим"],"k":3,"r":"Бекиткич : анын буюму","e":"Топчу көйнөктү бекитет. Боо бут кийимди бекитет. Экөө тең «бекиткич : ал бекиткен буюм». Калган варианттарда экинчи сөз бекитилген нерсе эмес."},{"n":100,"s":"Гезит : Супер Инфо","o":["Гүл : роза","Повесть : Жамиля","Унаа : Мерседес","Аэропорт : Манас"],"k":2,"r":"Түр : анын белгилүү аталышы","e":"Гезит басма продукциясы, «Супер Инфо» анын аталышы. Унаа : Мерседес да ушундай: унаа түрү жана анын аталышы (бренди). Гүл : роза өсүмдүк түрү, аталыш эмес.","i":"«Повесть : Жамиля» жана «аэропорт : Манас» да аталыштар. Ачкыч боюнча туура жооп В."},{"n":95,"s":"Кылмыш : жаза","o":["Күнөө : тозок","Соода : товар","Сүйүү : бакыт","Жумуш : акы"],"k":3,"r":"Иш : ага татыктуу жооп","e":"Кылмыш жасаганга жаза берилет. Жумуш жасаганга акы төлөнөт. Экөө тең «иш : ага татыктуу жооп»."},{"n":52,"s":"Түлкү : куу","o":["Дельфин : акылдуу","Кумурска : эмгекчил","Пил : чоң","Чычкан : шамдагай"],"k":1,"r":"Жаныбар : анын элдик мүнөзү","e":"Элдик түшүнүктө түлкү куу, кумурска эмгекчил. «Жаныбар : ага мүнөздүү элдик сапат» ушул. Пил : чоң өлчөм, ал мүнөз эмес.","i":"«Дельфин : акылдуу» да ошол эле түргө кирет. Ачкыч боюнча туура жооп Б."}],[{"n":4,"s":"Кыш : лыжа","o":["Жаз : велосипед","Күз : чуркоо","Жай : скутер","Кыш : муз аянтчасы"],"k":2,"r":"Мезгил : ага мүнөздүү каражат","e":"Кышында лыжа тебилет, лыжа кышкы мезгилдин өзүнө таандык буюм. Жайында скутер минилет, ошондуктан «жай : скутер» ошол эле жүйө менен түзүлгөн. Күз : чуркоо иш-аракет, кыш : муз аянтчасы жер, ошондуктан алардын түзүлүшү башкача.","i":"«Жаз : велосипед» да жакын көрүнөт, бирок ачкыч боюнча туура жооп В."},{"n":47,"s":"Жактырбоо : жек көрүү","o":["Капалануу : ыйлоо","Айрылуу : ажыроо","Айтпоо : сүйлөө","Жактыруу : сүйүү"],"k":3,"r":"Начар даража : күчтүү даража","e":"Жактырбоо жек көрүүгө чейин күчөйт. Жактыруу да сүйүүгө чейин күчөйт. Экөө тең бир сезимдин жумшак жана күчтүү даражасы."},{"n":91,"s":"Дарбыз : данектүү","o":["Китеп : маңыздуу","Коон : сары","Мугалим : билимдүү","Акула : тиштүү"],"k":3,"r":"Нерсе : анын өзгөчө белгиси","e":"Дарбыз данектүү. Акула тиштүү. «Нерсе : анын өзгөчө белгиси» ушул."},{"n":5,"s":"Сарай : тулку","o":["Тоокана : короз","Ийин : жылан","Уя : мышык","Үй : карышкыр"],"k":2,"r":"Жайгашкан жер : ал жердеги жан","e":"Ачкыч боюнча туура жооп В (уя : мышык). Суроонун башкы жубу («сарай : тулку») так эмес болгондуктан, ишенимдүү логикалык түшүндүрмө берүү кыйын.","w":"Бул суроодо ката бар окшойт: башкы жуп түшүнүктүү эмес, ал эми В варианты логикага анча дал келбейт («ийин : жылан» же «тоокана : короз» «жашаган жер : жандык» деген байланышка жакыныраак). Түп нускадан текшерип алыңыз."},{"n":25,"s":"Лыжачы : лыжа","o":["Штангист : гантель","Волейболчу : торчо","Сүзүүчү : суу","Футболчу : топ"],"k":3,"r":"Спортчу : анын негизги куралы","e":"Лыжачы лыжа менен чуркайт, лыжа анын негизги куралы. Футболчунун негизги куралы топ. Штангист гантель эмес, штанга менен иштейт. Волейболчуда торчо тосмо, куралы эмес, ал эми суу сүзүүчүнүн чөйрөсү."},{"n":40,"s":"Жип : аркан","o":["Таарынды : тактай","Козу : борук","Кагаз : картон","Дептер : блокнот"],"k":2,"r":"Ичке : жоон (бир материал, ар башка калыңдык)","e":"Жип ичке, аркан жоон, экөө тең бир материалдан жасалат. Кагаз менен картон да бир материал, картон калыңыраак. Калган варианттарда бул байланыш жок."},{"n":60,"s":"Кум : майда","o":["Саман : сары","Топ : тоголок","Уй : семиз","Десерт : таттуу"],"k":1,"r":"Нерсе : анын негизги белгиси","e":"Кум майда болот. Топ тоголок болот. «Нерсе : анын мүнөздүү белгиси» ушул.","i":"Саман : сары, десерт : таттуу да белги болуп көрүнөт. Ачкыч боюнча туура жооп Б."},{"n":96,"s":"Хиджаб : араб","o":["Калпак : кыргыз","Үкү топу : кыргыз","Элечек : кыргыз","Белдемчи : кыргыз"],"k":2,"r":"Баш кийим : ал таандык эл","e":"Хиджаб араб аялдарынын баш кийими. Элечек да кыргыз аялдарынын баш кийими. Калпак эркектики, үкү топу калпактын жасалгасы, ал эми белдемчи белге байланат."},{"n":56,"s":"Машыгуу : жеңүү","o":["Күлдүрүү : жылмаюу","Издөө : табуу","Бириктирүү : чогултуу","Баруу : көрүү"],"k":1,"r":"Аракет : анын максаты","e":"Машыгуунун максаты жеңүү. Издөөнүн максаты табуу. Экөө тең «аракет : анын максаты/жыйынтыгы»."},{"n":53,"s":"Дөңгөлөк : тоголок","o":["Китеп : пайдалануу","Кино : үйрөтүүчү","Китеп : төрт бурчтук","Алмаз : түссүз"],"k":2,"r":"Буюм : анын формасы","e":"Дөңгөлөк тоголок формада. Китеп төрт бурчтук формада. Экөө тең «нерсе : анын формасы». Калган варианттарда экинчи сөз форма эмес."},{"n":62,"s":"Жаан : жаратылыш","o":["Суу : гидрология","Миф : микология","Дин : теология","Эл : психология"],"k":0,"r":"Нерсе : аны үйрөнгөн илим","e":"Суу гидрологиянын изилдөө объектиси, жаан да суу менен байланышкан жаратылыш кубулушу. «Нерсе : аны үйрөнгөн илим» ушул. Миф : микология жана эл : психология туура эмес, илим менен объекти дал келбейт.","i":"«Дин : теология» да мындай байланышка ылайык, бирок ачкыч боюнча туура жооп А."},{"n":84,"s":"Шар : тегерек","o":["Куб : төрт бурчтук","Призма : көп бурчтуу","Үч бурчтук : пирамида","Сүйрү : ийри"],"k":0,"r":"Фигура : анын белгиси","e":"Шар тегерек, куб төрт бурчтук формада. Экөө тең «фигура : анын формасынын белгиси»."},{"n":73,"s":"Шизофрения : психиатрия","o":["Аппендицит : операция","Жаракат : дарыкана","Контузия : оорукана","Кариес : стоматология"],"k":3,"r":"Оору : аны дарылоочу тармак","e":"Шизофренияны психиатрия дарылайт. Кариести стоматология дарылайт. Экөө тең «оору : анын медициналык тармагы»."},{"n":17,"s":"Урук : алма","o":["Көчөт : бак","Түйүлдүк : мышык","Ымыркай : өспүрүм","Урук : өсүмдүк"],"k":1,"r":"Башталыш : андан өнүккөн жан","e":"Урукка алма өсүп чыгат, түйүлдүктөн мышык өнүп чыгат. Экөө тең «биринчи баскыч : андан өнүгүүчү тирүү дүйнө». Г вариантындагы «урук : өсүмдүк» суроодогу «урук» сөзүн кайра колдонуп жаткандыктан ачкычка кирген эмес."},{"n":34,"s":"Чопо : идиш","o":["Суу : муз","Жибек : кийим","Кагаз : куттуктоо баракчасы","Кар : киши"],"k":1,"r":"Материал : андан жасалган буюм","e":"Чоподон идиш жасалат. Жибектен кийим жасалат. Экөө тең «материал : андан жасалган буюм». Суу : муз абалдын өзгөрүшү, кар : киши оюнчук, ал эми кагаз : куттуктоо баракчасы жакын көрүнгөнү менен ачкыч Б."},{"n":98,"s":"Санаторий : эс алуу","o":["Гостиница : эс алуу","Пляж : эс алуу","Пансионат : эс алуу","Жайлоо : эс алуу"],"k":2,"r":"Мекеме : анын милдети","e":"Санаторий эс алуу жана дарыланууга арналган мекеме. Пансионат да эс алууга арналган мекеме. Пляж менен жайлоо табигый жерлер, мекеме эмес.","i":"Гостиница да мекеме, ошондуктан бул суроо толук так эмес. Ачкыч боюнча туура жооп В."},{"n":89,"s":"Каткыруу : жылмаюу","o":["Жинденүү : чыдоо","Урушуу : мактоо","Ыйлоо : өкүрүү","Бакыруу : шыбыроо"],"k":3,"r":"Катуу даража : акырын даража","e":"Каткыруу катуу күлүү, жылмаюу акырын күлүү. Бакыруу катуу чыгуу, шыбыроо акырын сүйлөө. «Катуу : акырын» ушул."},{"n":88,"s":"Шейх : кардинал","o":["Мечит : икона","Үй : батир","Бала : кыз","Президент : султан"],"k":3,"r":"Кызмат : башка системадагы теңдеши","e":"Шейх исламдагы, кардинал католик чиркөөсүндөгү жогорку кызмат. Президент менен султан да башка системадагы мамлекет башчылары. «Кызмат : башка системадагы теңдеши»."},{"n":50,"s":"Тажатуу : жүдөтүү","o":["Оройлонуу : катуу айтуу","Жубатуу : сооротуу","Жуунуу : тазалануу","Даярдануу : машыгуу"],"k":1,"r":"Синоним (маанилеш сөздөр)","e":"Тажатуу менен жүдөтүү маанилеш сөздөр. Жубатуу менен сооротуу да ошондой. Калган варианттарда сөздөр окшош, бирок бирдей мааниде эмес."},{"n":8,"s":"Китеп : китепкана","o":["Парта : класс","Бейтап : оорукана","Мектеп : стол","Кийим : чемодан"],"k":0,"r":"Буюм : ал турган жер","e":"Китеп китепканада турат. Парта классста турат. Экөө тең «буюм : ал турган жер». Бейтап : оорукана да жакын көрүнөт, бирок бейтап адам, ал эми китеп менен парта буюм. В вариантында тартип тескери, Г вариантында маани дал келбейт."}],[{"n":32,"s":"Сүрөтчү : кисть","o":["Сүрөтчү : портрет","Сүрөтчү : боёк","Сүрөтчү : калем сап","Сүрөтчү : кагаз"],"k":2,"r":"Кесип : анын куралы","e":"Сүрөтчү кисть (чөткө) менен иштейт, кисть анын куралы. Калем сап да сүрөтчүнүн куралы. Портрет жыйынтык, боёк материал, кагаз негиз, ошондуктан алар курал эмес."},{"n":75,"s":"Помада : эрин","o":["Лак : манжа","Крем : кол","Пудра : бет","Шампунь : чач"],"k":2,"r":"Косметика : ал жагылган жер","e":"Помада эринге жагылат. Пудра бетке жагылат. Экөө тең «косметика : ал жагылган жер».","i":"А, Б, Г да ошол эле жүйөгө ылайык. Ачкыч боюнча туура жооп В."},{"n":38,"s":"Секирүү : бийик","o":["Эңкейүү : жапыз","Шашуу : алыс","Жетүү : жакын","Түгөтүү : аз"],"k":0,"r":"Аракет : анын багыты","e":"Секирүү бийикке карай жасалат. Эңкейүү жапызга карай жасалат. Экөө тең «аракет : анын багыты». Шашуу менен алыс, жетүү менен жакын, түгөтүү менен аз багытты көрсөтпөйт."},{"n":26,"s":"Транспортир : градус","o":["Тараза : килограмм","Циркуль : тегерек","Сызгыч : узундук","Суу : грамм"],"k":2,"r":"Прибор : ал өлчөгөн чоңдук","e":"Транспортир бурчту градус менен өлчөйт. Сызгыч узундукту өлчөйт. Ачкыч боюнча туура жооп В.","w":"«Тараза : килограмм» да так ушундай («прибор : анын бирдиги») болуп турат, ошондуктан ачкычты текшерип алыңыз."},{"n":6,"s":"Сабак : класс","o":["Буудай : кампа","Концерт : театр","Соода : базар","Оомат : хан сарай"],"k":2,"r":"Иш-аракет : ал өтүүчү негизги жер","e":"Сабак классста өтөт. Соода базарда жүрөт. Экөө тең «иш-аракет : ал жасалуучу негизги жер». Концерт : театр да жакын көрүнөт, бирок концерт ар кандай жерде өтөт, ал эми буудай : кампа буюм менен ал сакталуучу жер, башка байланыш."},{"n":28,"s":"Хирург : оорукана","o":["Окуучу : лаборатория","Актёр : театр","(вариант булак текстте жок)","Мугалим : класс"],"k":1,"r":"Кесип : иштеген жери","e":"Хирург оорукана иштеген жеринде эмгектенет. Актёр театрда иштейт. Экөө тең «кесип : анын иш орду». Окуучу лабораториянын кесиби эмес.","i":"Булактагы тестте В вариантынын текстиси жок. «Мугалим : класс» да окшош көрүнөт, бирок ачкыч боюнча туура жооп Б."},{"n":59,"s":"Формула : эсеп чыгаруу","o":["Акча : сатып алуу","Дары : айыгуу","Отун : жагуу","Бычак : кесүү"],"k":1,"r":"Курал : анын максаты","e":"Формула менен эсеп чыгарабыз. Дары менен айыгабыз. «Курал : ал аткарган максат». Ачкыч боюнча туура жооп Б.","i":"А, В, Г да ушул жүйөгө ылайык келет, ошондуктан бул суроо толук так эмес."},{"n":68,"s":"Сүт эмүүчү : эчки","o":["Маймыл : шимпанзе","Жырткыч : жолборс","Эшек : качыр","Канаттуу : тее куш"],"k":3,"r":"Класс : анын өкүлү","e":"Эчки сүт эмүүчүлөрдүн өкүлү. Куш да канаттууларга таандык. Экөө тең «класс : анын өкүлү».","i":"«Жырткыч : жолборс» жана «маймыл : шимпанзе» да ошол эле түргө кирет. Ачкыч боюнча Г. «Тее куш» сөзү булакта так эмес."},{"n":24,"s":"Пайдасыз : ыргытуу","o":["Белгисиз : издебөө","Керектүү : колдонуу","Иретсиз : чачуу","Белгилүү : тактоо"],"k":1,"r":"Сапат : ага ылайыктуу иш-аракет","e":"Пайдасыз нерсени ыргытабыз. Керектүү нерсени колдонобуз. Экөө тең «нерсенин сапаты : ага ылайык иш-аракет». Калган варианттарда сапат менен иш-аракеттин ортосунда ушундай так байланыш жок."},{"n":90,"s":"Банги : ден-соолук","o":["Макияж : келбет","Таштанды : чөйрө","Темир : дат","Тарбия : жүрүм-турум"],"k":1,"r":"Зыян келтирүүчү : зыян тарткан нерсе","e":"Банги ден-соолукка зыян келтирет. Таштанды чөйрөгө зыян келтирет. Экөө тең «зыян келтирүүчү : анын курмандыгы»."},{"n":86,"s":"Ыр : акын","o":["Роман : автор","Чыгарма : жазуучу","Дары : фармацевт","Мелодия : аспап"],"k":0,"r":"Чыгарма : анын автору","e":"Ыр акындын чыгармасы. Роман автордун чыгармасы. Экөө тең «чыгарма : анын автору».","i":"«Чыгарма : жазуучу» да ошондой, бирок биринчи сөзү жалпы. Ачкыч боюнча туура жооп А."},{"n":20,"s":"Сүйлөм : текст","o":["Боёк : сүрөт","Тыбыш : сөз","Сүйлөм : ой","Идея : роман"],"k":1,"r":"Бөлүк : бүтүн","e":"Сүйлөм тексттин бир бөлүгү. Тыбыш да сөздүн бир бөлүгү. Экөө тең «бөлүк : бүтүн». Боёк : сүрөт да бөлүк-бүтүнгө окшош, бирок «тыбыш : сөз» суроонун тил тармагына жакын."},{"n":82,"s":"Джаз : блюз","o":["Роман : поэма","Комедия : трагедия","Актёр : ырчы","Трио : квартет"],"k":1,"r":"Бир тармактын эки жанры","e":"Джаз менен блюз музыканын эки түрү. Комедия менен трагедия драманын эки түрү. «Бир тармактын эки жанры» ушул. Актёр : ырчы кесиптер.","i":"«Роман : поэма» да адабий жанрлар. Ачкыч боюнча туура жооп Б."},{"n":55,"s":"Доктур : дарылоо","o":["Адабиятчы : жазуу","Тарбиялоо : мугалим","Соодагер : соодалашуу","Окумуштуу : изилдөө"],"k":3,"r":"Кесип : анын негизги иши","e":"Доктур дарылайт. Окумуштуу изилдейт. «Кесип : анын негизги иши». Тарбиялоо : мугалим тескери тартипте турат.","i":"«Соодагер : соодалашуу» да окшош көрүнөт. Ачкыч боюнча туура жооп Г."},{"n":69,"s":"Туз : даам","o":["Жылыткыч : аба","Шекер : чай","Атыр : жыт","Суу : ылай"],"k":2,"r":"Зат : ал берген сезим","e":"Туз даам берет. Атыр жыт берет. Экөө тең «зат : ал берген сезим»."},{"n":42,"s":"Колдонуу : эскирүү","o":["Ыргытуу : кирүү","Ооруу : жатуу","Зеригүү : ойноо","Ачуу : жабуу"],"k":1,"r":"Себеп : натыйжа","e":"Бир нерсени көп колдонсок, ал эскирет. Ооруса адам жатат. Экөө тең «себеп : натыйжа». Ачуу менен жабуу карама-каршы, ыргытуу : кирүү байланышсыз."},{"n":85,"s":"Күн : Космос","o":["Кычкылтек : Жер","Ай : орбита","Жылдыз : асман","Жаныбар : токой"],"k":2,"r":"Объект : ал таандык мейкиндик","e":"Күн Космостогу жылдыз. Жылдыз да асман мейкиндигине таандык. «Объект : ал таандык мейкиндик» ушул."},{"n":67,"s":"Семиз : толук","o":["Кызыл : кызгылтым","Өйдө : бийик","Бала : өспүрүм","Кер : азиз"],"k":3,"r":"Синоним (маанилеш сөздөр)","e":"Ачкыч боюнча туура жооп Г.","w":"«Өйдө : бийик» синоним катары көбүрөөк ылайык келет, ал эми «кер : азиз» суроодо түшүнүксүз. Ачкычты текшерип алыңыз."},{"n":30,"s":"Нөшөр : сел","o":["Кар : жылгаяк","Ширеңке : от","Жер титирөө","Аптап : кургакчылык"],"k":3,"r":"Себеп : натыйжа","e":"Нөшөр жамгыр сел алып келет. Аптап да кургакчылыкка алып барат. Экөө тең «табигый кубулуш : анын кесепети». Ширеңке : от да себеп-натыйжа, бирок табигый кубулуш эмес.","i":"Булактагы тестте В вариантында экинчи сөз жок (толук эмес)."},{"n":61,"s":"Интернет : роутер","o":["Саат : батарейка","Эшик : ачкыч","Сыналгы : басмак","Мылтык : ок"],"k":0,"r":"Система : аны иштеткен түзүлүш","e":"Интернет роутер аркылуу жеткирилет. Саат батарейка менен иштейт. Экөө тең «система : аны иштеткен түзүлүш»."}],[{"n":19,"s":"Аңгеме : кыска","o":["Эпос : көлөмдүү","Жомок : кызыктуу","Биография : узун","Ыр : уккулуктуу"],"k":0,"r":"Жанр : анын мүнөздүү белгиси","e":"Аңгеме көлөмү кичине (кыска) чыгарма. Эпос көлөмү чоң (көлөмдүү) чыгарма. «Жанр : анын негизги белгиси» ушул. Жомок : кызыктуу жана ыр : уккулуктуу жеке баа, жанрды аныктоочу белги эмес."},{"n":35,"s":"Асман : обо","o":["Топурак : жер","Батир : үй","Желек : асаба","Даанышман : чечен"],"k":2,"r":"Түшүнүк : ага байланыштуу нерсе","e":"Ачкыч боюнча туура жооп В (желек : асаба): желек асабага илинет.","w":"«Асман : обо» деген башкы жуптун мааниси так эмес, ошондуктан толук логикалык түшүндүрмө берүү кыйын. Түп нускадан текшерип алыңыз."},{"n":36,"s":"Учак : аэропорт","o":["Унаа : гараж","Поезд : метро","Ат араба : короо","Кеме : порт"],"k":3,"r":"Транспорт : ал токтоочу бекет","e":"Учак аэропортко конот, кеме портко токтойт. Экөө тең «транспорт : анын бекети». Унаа : гараж сактоочу жер, поезд : метро ар башка транспорт, ат араба : короо мал турак жайы."},{"n":12,"s":"Кежир : тил албас","o":["Жоош : момун","Урушчаак : сабырдуу","Жалганчы : бетпак","Элпек : шамдагай"],"k":3,"r":"Синоним (маанилеш сөздөр)","e":"Кежир тил албас, өжөр дегенди билдирет. Элпек менен шамдагай да бирдей маанидеги сөздөр. Урушчаак менен сабырдуу карама-каршы, ал эми жалганчы менен бетпак байланышсыз.","i":"«Жоош : момун» да синоним, ошондуктан бул суроодо эки вариант жакын. Ачкыч боюнча Г."},{"n":44,"s":"Учак : канат","o":["Шайтан араба : дөңгөлөк","Телефон : энергия","Камаз : жүк","От араба : от"],"k":0,"r":"Транспорт : аны кыймылдатуучу бөлүк","e":"Учак канаттын жардамы менен учат. Шайтан араба дөңгөлөк менен жүрөт. Экөө тең «транспорт : аны жылдырган негизги бөлүк». Телефон : энергия, камаз : жүк, от араба : от башка байланыштар."},{"n":10,"s":"Үч бурчтук : фигура","o":["Мебель : жыгач","Китеп : кагаз","Бугу : уруу","Өсүмдүк : биология"],"k":2,"r":"Жеке түр : анын жалпы тобу","e":"Үч бурчтук фигуралардын бир түрү. Бугу да кыргыз урууларынын бири. Экөө тең «жеке түр : анын жалпы тобу». Мебель : жыгач, китеп : кагаз буюм менен материал, ал эми өсүмдүк : биология объект менен илим."},{"n":97,"s":"Саат : убакыт","o":["Термометр : жылуулук","Секундомер : тездик","Компас : багыт","Тараза : салмак"],"k":2,"r":"Прибор : ал көрсөткөн нерсе","e":"Саат убакытты көрсөтөт. Компас багытты көрсөтөт. Экөө тең «прибор : ал көрсөткөн нерсе». Секундомер тездикти эмес, убакытты өлчөйт.","i":"А жана Г да ушундай жүйөгө ылайык. Ачкыч боюнча туура жооп В."},{"n":49,"s":"Казан : кулак","o":["Эшик : тутка","Самоор : чорго","Бут кийим : боо","Шым : чентек"],"k":0,"r":"Буюм : аны кармоочу бөлүк","e":"Казанды кулагынан кармайбыз. Эшикти туткасынан кармайбыз. Экөө тең «буюм : аны кармоочу бөлүк». Самоор : чорго, бут кийим : боо, шым : чентек кармагыч эмес."},{"n":46,"s":"Жел : шамал","o":["Чачык : баш аламан","Келчүк : океан","Таш : аска","Шүүдүрүм : бубак"],"k":3,"r":"Синоним (маанилеш сөздөр)","e":"Жел менен шамал бир кубулуштун эки аталышы. Шүүдүрүм менен бубак да маанилеш сөздөр катары берилген. Калган варианттар башка байланыштарда."},{"n":45,"s":"Оюн : көк бөрү","o":["Оюн : футбол","Оюн : теннис","Оюн : топ таш","Оюн : ордо"],"k":0,"r":"Оюн : оюндун түрү","e":"Ачкыч боюнча туура жооп А. Көк бөрү менен футбол командалык оюндар.","w":"«Топ таш» же «ордо» да улуттук оюндар. Ачкыч А дейт, бирок бул суроонун логикасы так эмес. Текшерип алыңыз."},{"n":33,"s":"Ийне : темене","o":["Аш айры : айры","Күзгү : тарак","Балка : балта","Повесть : поэма"],"k":0,"r":"Окшош түзүлүштөгү куралдар","e":"Ийне менен темене эки учу так, тешүүчү куралдар. Аш айры менен айры да бир түрдөгү курал (кичинеси жана чоңу). Күзгү : тарак жана повесть : поэма башка топтор.","i":"«Балка : балта» да эки курал, ошондуктан бул суроо толук ачык эмес. Ачкыч боюнча туура жооп А."},{"n":51,"s":"Декан : университет","o":["Мугалим : мектеп","Администрация : ресторан","Башкы врач : оорукана","Официант : кафе"],"k":1,"r":"Жетекчи : мекеме","e":"Ачкыч боюнча туура жооп Б.","w":"Декан университеттин (факультеттин) жетекчиси, ошондуктан «башкы врач : оорукана» (жетекчи : мекеме) логикага жакыныраак көрүнөт. Ачкыч Б дейт, текшерип алыңыз."},{"n":27,"s":"Жарык : фотосинтез","o":["Азык : энергия","Тоют : мал","Шекер : диабет","Элемент : реакция"],"k":0,"r":"Булак : андан келип чыккан процесс","e":"Фотосинтез жарыктан башталат, жарык анын энергия булагы. Азык да энергия берет, «булак : андан чыккан натыйжа». Калган варианттарда булактын жыйынтыгы ушундай эмес."},{"n":99,"s":"Каакым : өсүмдүк","o":["Алма : жемиш","Осётр : балык","Кайың : бак","Буркут : жаныбар"],"k":3,"r":"Өкүл : ири дүйнө","e":"Каакым өсүмдүктөр дүйнөсүнүн өкүлү. Буркут жаныбарлар дүйнөсүнүн өкүлү. Калган варианттарда экинчи сөз кичирээк топ (жемиш, балык, бак)."},{"n":87,"s":"Кыял : иш-аракет","o":["Жалкоолук : мээнеткечтик","Максат : эмгек","Сүйүү : симпатия","Тилек : бата"],"k":3,"r":"Ой : ага жооп/кийинки кадам","e":"Ачкыч боюнча туура жооп Г (тилек : бата).","w":"«Максат : эмгек» (ой : анын аткарылышы) логикага жакыныраак көрүнөт. Ачкыч Г дейт, текшерип алыңыз."},{"n":2,"s":"Фонетика : тыбыш","o":["Фразеологизм : сөз айкашы","Макал-лакап : сөз","Текст : сүйлөм","Пунктуация : тыныш белги"],"k":3,"r":"Илим : ал үйрөнгөн объект","e":"Фонетика тыбыштарды үйрөнөт. Пунктуация да тыныш белгилерди үйрөнөт. Экөө тең «тил илиминин бөлүмү : анын изилдөө объектиси». Калган үч вариантта биринчи сөз илим эмес, алар тилдин бирдиктери (фразеологизм, макал-лакап, текст)."},{"n":58,"s":"Жарыш : эрегишүү","o":["Тамак : тоюу","Ооруу : азап чегүү","Университет : билүү","Сынак : атаандашуу"],"k":1,"r":"Кубулуш : ага жараша абал","e":"Ачкыч боюнча туура жооп Б (ооруу : азап чегүү).","w":"Жарыш менен эрегишүү маанилеш болгондуктан «сынак : атаандашуу» логикага жакыныраак көрүнөт. Ачкыч Б дейт, текшерип алыңыз."},{"n":13,"s":"Музоо : торпок","o":["Тай : кунан","Күчүк : тайган","Такай : эшек","Ымыркай : өспүрүм"],"k":0,"r":"Жаш мал : ал өскөндөгү кийинки курагы","e":"Музоо өсүп торпок болот, бул жаш малдын кийинки куракка өтүшү. Тай да өсүп кунан болот. Күчүк : тайган вариантында тайган ит тукуму, курак эмес. Ымыркай : өспүрүм адамдын курагы, жаныбар эмес."},{"n":37,"s":"Фортепиано : клавиша","o":["Комуз : тепке","Гитара : кыл","Флейта : аба","Чопо-чоор : тешикче"],"k":2,"r":"Аспап : ага байланыштуу бөлүк","e":"Ачкыч боюнча туура жооп В (флейта : аба): флейтага аба үйлөнөт, ал аркылуу үн чыгат.","w":"«Чопо-чоор : тешикче» же «гитара : кыл» логикага жакыныраак көрүнөт (аспаптын үн чыгарууда колдонулган бөлүгү). Ачкычты текшерип алыңыз."},{"n":15,"s":"Уялчаак : тартынчаак","o":["Намыскей : көк бет","Улуу : барктуу","Билимдүү : сабаттуу","Ийкемдүү : ийменчээк"],"k":2,"r":"Синоним (маанилеш сөздөр)","e":"Уялчаак менен тартынчаак бирдей мааниде. Билимдүү менен сабаттуу да бири-бирине жакын маанидеги сөздөр. Ийкемдүү менен ийменчээк айырмалуу сапаттар, намыскей менен көк бет байланышсыз."}],[{"n":11,"s":"Арал : архипелаг","o":["Дарыя : көл","Толкун : цунами","Жылдыз : топ жылдыз","Планета : галактика"],"k":2,"r":"Жалгыз : топ","e":"Арал бир гана кургак жер бөлүгү, архипелаг аралдардын тобу. Жылдыз да бир гана жылдыз, топ жылдыз жылдыздардын тобу. Дарыя : көл жана толкун : цунами башка байланыштар (бир түр, күчөгөн даража)."},{"n":79,"s":"Вирус : оору","o":["Тамаша : күлүү","Брекет : түздөө","Клей : чаптоо","Дары : сакайтуу"],"k":0,"r":"Себеп : натыйжа","e":"Вирус оору келтирет. Тамаша күлкү келтирет. Экөө тең «себеп : натыйжа»."},{"n":1,"s":"Бут кийим : майлоо","o":["Казан : коолоо","Сакал : алуу","Чаң : сүртүү","Тиш щётка"],"k":0,"r":"Буюм : ага жасалуучу кам көрүү","e":"Алгач байланышты табабыз: бут кийимди жумшартуу жана сактоо үчүн майлайбыз. Демек биринчи сөз буюм, экинчиси ага жасалуучу иш. А вариантында да ошондой: казан да коолонуп (оңдолуп) тейленет. Сакал алуу менен чаң сүртүү башка жүйөгө таандык, ал эми Г вариантында экинчи сөз жок, ошондуктан ал жарабайт."},{"n":31,"s":"Шоколад : таттуу","o":["Палоо : даамдуу","Өрүк : эзилген","Лимон : кычкыл","Сабиз : катуу"],"k":2,"r":"Нерсе : анын негизги даамы const LET = ['А', 'Б', 'В', 'Г'];
const app = document.getElementById('app');
let view = 'home';
let cur = { t: 0, i: 0, ans: [] };
let filter = 'wrong';

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return e;
}
function pair(text) {
  const i = text.indexOf(' : ');
  if (i < 0) return h('span', { class: 'pair' }, text);
  return h('span', { class: 'pair' },
    h('span', { class: 'pl' }, text.slice(0, i)),
    h('span', { class: 'pc' }, ':'),
    h('span', { class: 'pr' }, text.slice(i + 3)));
}
function loadBest() { try { return JSON.parse(localStorage.getItem('analogy-best') || '{}'); } catch (e) { return {}; } }
function saveBest(t, s) { try { const b = loadBest(); if (!(b[t] >= s)) { b[t] = s; localStorage.setItem('analogy-best', JSON.stringify(b)); } } catch (e) {} }
function mount(...nodes) { app.replaceChildren(...nodes); }
function toTop() { window.scrollTo(0, 0); }

function renderHome() {
  view = 'home';
  const best = loadBest();
  const total = TESTS.reduce((n, t) => n + t.length, 0);
  mount(
    h('header', { class: 'hero' },
      h('p', { class: 'kicker' }, 'Аналогия'),
      h('h1', null, 'Аналогия тесттери'),
      h('p', null, total + ' суроо аралаштырылып, ' + TESTS.length + ' тестке бөлүндү. Ар бир суроодон кийин туура жооп жана эмне үчүн туура экени чыгат.')
    ),
    h('div', { class: 'tiles' }, TESTS.map((T, t) =>
      h('div', { class: 'tile' },
        h('div', null, h('p', { class: 'kicker' }, 'Тест'), h('p', { class: 'num' }, String(t + 1))),
        h('p', { class: 'meta' }, T.length + ' суроо'),
        h('p', { class: 'best' }, best[t] != null ? 'Мыкты жыйынтык: ' + best[t] + ' / ' + T.length : 'Али тапшырган жоксуз'),
        h('button', { class: 'btn', type: 'button', onclick: () => startTest(t) }, best[t] != null ? 'Кайра тапшыруу' : 'Баштоо')
      ))),
    h('p', { class: 'legend' },
      h('b', null, 'Эскертүү. '),
      'Жооп ачкычы сиз берген тизмеден алынды. Айрым суроолордо жооп ачкычы логикага туура келбей калышы мүмкүн, андайларда түшүндүрмөнүн астында сары эскертүү чыгат.')
  );
  toTop();
}

function startTest(t) {
  cur = { t, i: 0, ans: Array(TESTS[t].length).fill(null) };
  filter = 'wrong';
  renderQuiz();
  toTop();
}

function pick(j) {
  const q = TESTS[cur.t][cur.i];
  if (cur.ans[cur.i] !== null) return;
  cur.ans[cur.i] = j;
  renderQuiz(true);
}
function go(d) {
  const n = cur.i + d;
  if (n < 0) return;
  if (n >= TESTS[cur.t].length) { renderResult(); return; }
  cur.i = n; renderQuiz(); toTop();
}

function renderQuiz(justAnswered) {
  view = 'quiz';
  const T = TESTS[cur.t], q = T[cur.i], a = cur.ans[cur.i], done = a !== null, ok = a === q.k;
  const last = cur.i === T.length - 1;
  const answeredCount = cur.ans.filter(x => x !== null).length;

  const dots = h('div', { class: 'dots' }, T.map((x, j) => {
    const s = cur.ans[j];
    const cls = 'dot' + (j === cur.i ? ' cur' : '') + (s === null ? '' : (s === x.k ? ' ok' : ' bad'));
    return h('button', { class: cls, type: 'button', 'aria-label': 'Суроо ' + (j + 1), 'aria-current': j === cur.i ? 'true' : null, onclick: () => { cur.i = j; renderQuiz(); } }, String(j + 1));
  }));

  const opts = h('div', { class: 'opts', role: 'group', 'aria-label': 'Жооп варианттары' }, q.o.map((txt, j) => {
    let cls = 'opt';
    let tag = null;
    if (done) {
      cls += ' locked';
      if (j === q.k) { cls += ' ok'; tag = j === a ? 'Сиздин жооп, туура' : 'Туура жооп'; }
      else if (j === a) { cls += ' bad'; tag = 'Сиздин жооп, ката'; }
      else cls += ' dim';
    }
    return h('button', { class: cls, type: 'button', 'aria-disabled': done ? 'true' : null, onclick: () => pick(j) },
      h('span', { class: 'ltr' }, LET[j]), pair(txt), tag ? h('span', { class: 'tag' }, tag) : null);
  }));

  let fb = null;
  if (done) {
    fb = h('div', { class: 'fb ' + (ok ? 'ok' : 'bad'), role: 'status', tabindex: '-1', id: 'fb' },
      h('p', { class: 'verdict' }, ok ? 'Туура!' : 'Ката. Туура жооп: ' + LET[q.k] + ') ' + q.o[q.k]),
      h('p', { class: 'why-h' }, 'Эмне үчүн?'),
      h('p', { class: 'rel' }, 'Байланыш: ' + q.r),
      h('p', { class: 'why' }, q.e),
      q.w ? h('p', { class: 'note warn' }, h('b', null, 'Көңүл буруңуз. '), q.w) : null,
      q.i ? h('p', { class: 'note' }, h('b', null, 'Эскертүү. '), q.i) : null,
      q.t ? h('p', { class: 'note' }, h('b', null, 'Текст оңдолду. '), q.t) : null
    );
  }

  mount(
    h('div', { class: 'bar' },
      h('button', { class: 'link', type: 'button', onclick: renderHome }, 'Башкы бет'),
      h('p', { class: 'count' }, 'Тест ' + (cur.t + 1) + ' · ' + (cur.i + 1) + ' / ' + T.length)
    ),
    dots,
    h('section', { class: 'card' },
      h('p', { class: 'eyebrow' }, 'Суроо ' + (cur.i + 1) + ' · булактагы № ' + q.n),
      h('p', { class: 'lead' }, 'Биринчи жуптун ортосундагы байланышты тап. Ошого окшош жупту танда.'),
      h('div', { class: 'stem' }, pair(q.s)),
      opts,
      fb,
      h('div', { class: 'nav' },
        h('button', { class: 'btn ghost', type: 'button', disabled: cur.i === 0, onclick: () => go(-1) }, 'Мурунку'),
        h('button', { class: 'btn', type: 'button', onclick: () => go(1) },
          last ? (answeredCount === T.length ? 'Жыйынтыкты көрүү' : 'Жыйынтык (' + (T.length - answeredCount) + ' жоопсуз)') : 'Кийинки суроо')
      )
    )
  );
  if (justAnswered) {
    const el = document.getElementById('fb');
    if (el) {
      el.focus({ preventScroll: true });
      const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      el.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'nearest' });
    }
  }
}

function renderResult() {
  view = 'result';
  const T = TESTS[cur.t];
  const score = T.reduce((n, q, j) => n + (cur.ans[j] === q.k ? 1 : 0), 0);
  const skipped = cur.ans.filter(x => x === null).length;
  const pct = Math.round(score / T.length * 100);
  saveBest(cur.t, score);
  const msg = pct >= 90 ? 'Эң сонун натыйжа.' : pct >= 70 ? 'Жакшы натыйжа. Каталарды карап чыгыңыз.' : pct >= 50 ? 'Орточо. Каталарды түшүндүрмөсү менен кайра окуп чыгыңыз.' : 'Кайра аракет кылыңыз. Түшүндүрмөлөр жардам берет.';

  const list = h('div', { class: 'rev' });
  function fill() {
    list.replaceChildren(...T.map((q, j) => ({ q, j })).filter(({ q, j }) => filter === 'all' || cur.ans[j] !== q.k).map(({ q, j }) => {
      const a = cur.ans[j], ok = a === q.k;
      const chip = a === null ? h('span', { class: 'chip skip' }, 'Жооп берилген жок') : h('span', { class: 'chip ' + (ok ? 'ok' : 'bad') }, ok ? 'Туура' : 'Ката');
      return h('details', { class: 'item', open: !ok },
        h('summary', null, h('span', { class: 'qn' }, String(j + 1)), pair(q.s), chip),
        h('div', { class: 'body' },
          h('div', { class: 'ans' },
            a !== null && !ok ? h('p', null, h('b', null, 'Сиздин жооп: '), LET[a] + ') ', pair(q.o[a])) : null,
            h('p', null, h('b', null, 'Туура жооп: '), LET[q.k] + ') ', pair(q.o[q.k]))),
          h('p', { class: 'rel' }, 'Байланыш: ' + q.r),
          h('p', { class: 'why' }, q.e),
          q.w ? h('p', { class: 'note warn' }, h('b', null, 'Көңүл буруңуз. '), q.w) : null,
          q.i ? h('p', { class: 'note' }, h('b', null, 'Эскертүү. '), q.i) : null,
          q.t ? h('p', { class: 'note' }, h('b', null, 'Текст оңдолду. '), q.t) : null
        ));
    }));
    if (!list.children.length) list.append(h('p', { class: 'note' }, 'Каталар жок. Бардык суроого туура жооп бердиңиз.'));
  }
  const tabWrong = h('button', { class: 'tab', type: 'button', onclick: () => set('wrong') }, 'Каталар');
  const tabAll = h('button', { class: 'tab', type: 'button', onclick: () => set('all') }, 'Бардык суроолор');
  function set(f) { filter = f; tabWrong.setAttribute('aria-pressed', String(f === 'wrong')); tabAll.setAttribute('aria-pressed', String(f === 'all')); fill(); }
  set(filter);

  mount(
    h('div', { class: 'bar' }, h('button', { class: 'link', type: 'button', onclick: renderHome }, 'Башкы бет'), h('p', { class: 'count' }, 'Тест ' + (cur.t + 1))),
    h('section', { class: 'score' },
      h('p', { class: 'kicker' }, 'Жыйынтык'),
      h('p', { class: 'big' }, score + ' / ' + T.length),
      h('div', { class: 'meter', role: 'img', 'aria-label': pct + ' пайыз' }, h('i', { style: 'width:' + pct + '%' })),
      h('p', null, pct + '% туура. ' + msg + (skipped ? ' Жооп берилбеген суроолор: ' + skipped + '.' : '')),
      h('div', { class: 'actions' },
        h('button', { class: 'btn', type: 'button', onclick: () => startTest(cur.t) }, 'Кайра тапшыруу'),
        h('button', { class: 'btn ghost', type: 'button', onclick: () => { cur.i = 0; renderQuiz(); toTop(); } }, 'Суроолорго кайтуу'),
        cur.t < TESTS.length - 1 ? h('button', { class: 'btn ghost', type: 'button', onclick: () => startTest(cur.t + 1) }, 'Кийинки тест') : null
      )
    ),
    h('div', { class: 'tabs' }, tabWrong, tabAll),
    list
  );
  toTop();
}

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (view === 'quiz') {
    if (e.key >= '1' && e.key <= '4') pick(Number(e.key) - 1);
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  }
});

renderHome();
</script>
